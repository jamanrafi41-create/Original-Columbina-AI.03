    <script>
      (function() {
        window.__columbinaDeferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__columbinaDeferredInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('columbina:pwa-prompt-ready'));
          console.log('[ColumbinaPWA] Captured beforeinstallprompt early in head.');
        });
      })();
    </script>
