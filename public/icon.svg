<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b38" />
      <stop offset="60%" stop-color="#0e0c1a" />
      <stop offset="100%" stop-color="#05040a" />
    </radialGradient>
    
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="wingGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#c4b5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="wingGradR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#c4b5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="crimsonAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer subtle celestial aura -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.15" />

  <!-- Ethereal Lunar Ring Glow -->
  <circle cx="256" cy="246" r="120" fill="#818cf8" fill-opacity="0.12" filter="url(#softGlow)" />

  <!-- Crescent Silver Moon of Columbina -->
  <path d="M256,120 A 126,126 0 1,0 382,246 A 108,108 0 1,1 256,120 Z" fill="url(#moonGrad)" filter="url(#glow)" opacity="0.95" />

  <!-- Stylized Left Wing -->
  <path d="M256,260 C210,210 140,215 110,245 C90,265 95,295 130,305 C170,315 215,295 256,260 Z" fill="url(#wingGradL)" />
  <path d="M256,265 C220,235 160,245 135,275 C120,295 140,320 170,325 C205,330 235,305 256,265 Z" fill="url(#wingGradL)" opacity="0.7" />

  <!-- Stylized Right Wing -->
  <path d="M256,260 C302,210 372,215 402,245 C422,265 417,295 382,305 C342,315 297,295 256,260 Z" fill="url(#wingGradR)" />
  <path d="M256,265 C292,235 352,245 377,275 C392,295 372,320 342,325 C307,330 277,305 256,265 Z" fill="url(#wingGradR)" opacity="0.7" />

  <!-- Central Columbina Diamond & Eye-Ribbon Star -->
  <g transform="translate(256, 260)">
    <!-- Crimson accent halo -->
    <circle cx="0" cy="0" r="28" fill="url(#crimsonAura)" filter="url(#glow)" opacity="0.8" />
    
    <!-- 4-pointed Fatui / Damselette Star -->
    <path d="M0,-36 L7,-10 L36,0 L7,10 L0,36 L-7,10 L-36,0 L-7,-10 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="6" fill="#f43f5e" />

    <!-- Delicate Star Accents -->
    <circle cx="-60" cy="-60" r="2.5" fill="#e2e8f0" opacity="0.8" />
    <circle cx="60" cy="-55" r="3" fill="#e2e8f0" opacity="0.9" />
    <circle cx="0" cy="-90" r="2.5" fill="#fbcfe8" opacity="0.85" />
    <circle cx="-80" cy="40" r="2" fill="#c4b5fd" opacity="0.7" />
    <circle cx="80" cy="40" r="2" fill="#c4b5fd" opacity="0.7" />
  </g>
</svg>